# 服务配置
server:
  port: 8094

spring:
  profiles:
    active: dev
  jackson:
    date-format: "yyyy-MM-dd HH:mm:ss"

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
